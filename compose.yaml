services:
  molai:
    build:
      context: .
      args:
        CUDA_IMAGE: nvidia/cuda:13.2.1-cudnn-devel-ubuntu24.04
    image: molai:cuda13.2
    working_dir: /workspace
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/molai-venv
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - .:/workspace
    gpus: all
    ipc: host
    stdin_open: true
    tty: true
