model:
  field_channels: 1
  condition_dim: 384
  fullres_dim: 64
  heads: 4
  condition_cross_depth: 2
  noise_cross_depth: 2
  noise_token_count: 64
  refine_depth: 8
  window_size: 8
  ffn_ratio: 2.0
  max_resolution: 256
  max_residual: 8.0
  noise_energy_min: 0.0001
  noise_energy_init: 0.1
  noise_amplitude_max: 8.0
  gradient_checkpointing: false

cloud_matching:
  batch_size_per_gpu: 16
  samples: 4
  answer_jump: 8
  clean_answer_probability: 0.25
  loss: energy_full_band
  full_band_levels: 3

training:
  epochs: 120
  learning_rate: 0.0001
  min_learning_rate: 0.00001
  validation_fraction: 0.02
  condition_dropout: 0.15
  peak_chunk_size: 64
  log_every: 1

spectrum_encoder:
  heads: 8
  peak_layers: 3
  spectrum_layers: 2
  relative_bands: 16
  relative_mass_max: 256.0
  ffn_ratio: 2.0
  dropout: 0.1
  peak_position_dim: 32
  mz_bin_width: 0.01
  mz_upper_bound: 5000.0
  peak_chunk_batch: 1024
