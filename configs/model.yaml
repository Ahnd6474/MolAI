model:
  field_channels: 1
  condition_dim: 384
  fullres_dim: 64
  heads: 4
  condition_cross_depth: 2
  condition_gate_init: 0.5
  noise_cross_depth: 1
  noise_token_count: 64
  noise_token_dim: 64
  noise_temperature: 0.8
  noise_gate_init: 0.02
  refine_depth: 6
  window_size: 8
  ffn_ratio: 2.0
  cvt_kernel_sizes: [3, 5, 7]
  cvt_output_sizes: [8, 4, 2]
  max_resolution: 256
  noise_energy_min: 0.0001
  noise_energy_init: 0.1
  noise_amplitude_max: 8.0
  zero_mean_output: true
  gradient_checkpointing: false

cloud_matching:
  batch_size_per_gpu: 16
  samples: 4
  transition_jumps:
    - {max_level: 8, jump: 1}
    - {max_level: 16, jump: 2}
    - {max_level: 32, jump: 4}
    - {max_level: 64, jump: 8}
  level_sampling: uniform
  unroll_fraction: 0.0
  noise_schedule:
    type: cosine_vp
    levels: 64
    cosine_offset: 0.008
    noise_scale: 3.5927782573874403
    zero_mean_noise: true
  validation_preview_levels: [8, 24, 48, 64]
  loss: energy_full_band
  full_band_levels: 3

training:
  epochs: 120
  learning_rate: 0.0001
  min_learning_rate: 0.00001
  validation_fraction: 0.02
  condition_dropout: 0.0
  peak_chunk_size: 256
  log_every: 1

spectrum_encoder:
  heads: 8
  peak_conv_stages: 2
  peak_conv_kernel_size: 5
  peak_tau_min: 0.005
  peak_tau_max: 2.0
  peak_cutoff_multiplier: 8.0
  spectrum_layers: 2
  ffn_ratio: 2.0
  dropout: 0.1
  peak_position_dim: 32
  mz_bin_width: 0.01
  mz_upper_bound: 5000.0
  peak_chunk_batch: 256
