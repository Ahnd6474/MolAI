model:
  field_channels: 1
  condition_dim: 384
  fullres_dim: 64
  heads: 4
  condition_cross_depth: 2
  condition_gate_init: 0.5
  noise_cross_depth: 1
  noise_token_count: 64
  noise_token_dim: 64
  noise_temperature: 0.8
  noise_gate_init: 0.02
  refine_depth: 6
  window_size: 8
  ffn_ratio: 2.0
  cvt_kernel_sizes: [3, 5, 7]
  # Final K/V grid side lengths (8x8, 4x4, 2x2), not strides.
  cvt_grid_sizes: [8, 4, 2]
  max_resolution: 256
  noise_energy_min: 0.0001
  noise_energy_init: 0.1
  noise_amplitude_max: 8.0
  zero_mean_output: true
  gradient_checkpointing: false

# Load the pretrained MolecularFieldCloud and train only the encoder-anchored
# cross/GLU state update and absolute decoder. Decoded images are supervised but
# never re-encoded between hidden rollout steps.
hidden_rollout:
  enabled: true
  max_level: 64
  gate_init: 0.02
  decoder_dim: 32
  # Encoder-anchor cross-attention uses a denser K/V representation than the
  # frozen residual backbone: 32x32 + 16x16 + 8x8 = 1,344 K/V tokens.
  kv_grid_sizes: [32, 16, 8]
  # Frozen-backbone one-step training uses one stochastic token sample.  The
  # decoder reconstruction and encoder-anchored transition losses are joint.
  batch_size_per_gpu: 64
  samples: 1
  reconstruction_weight: 1.0
  transition_weight: 1.0
  epochs: 20
  learning_rate: 0.0001
  min_learning_rate: 0.00001

# From-scratch absolute-image Cloud. Image-space attention uses CvT; compressed
# MS tokens and random tokens use ordinary cross-attention.
absolute_model:
  field_channels: 1
  image_dim: 64
  condition_dim: 64
  heads: 4
  condition_cross_depth: 2
  condition_gate_init: 0.5
  noise_token_count: 64
  noise_token_dim: 64
  noise_temperature: 0.8
  noise_gate_init: 0.02
  refine_depth: 6
  ffn_ratio: 2.0
  cvt_kernel_sizes: [3, 5, 7]
  cvt_grid_sizes: [32, 16, 8]
  max_level: 64
  anchor_gate_init: 0.02
  decoder_dim: 64
  noise_energy_min: 0.0001
  noise_energy_init: 0.1
  noise_amplitude_max: 8.0
  zero_mean_output: true
  gradient_checkpointing: true

absolute_training:
  epochs: 120
  batch_size_per_gpu: 16
  validation_batch_size_per_gpu: 4
  gradient_accumulation_steps: 1
  samples: 4
  zero_token_mse_weight: 0.05
  learning_rate: 0.0001
  min_learning_rate: 0.00001
  warmup_steps: 1000
  weight_decay: 0.0001
  # Exclude only the extreme ~0.1% tail after the two peak-pooling stages.
  max_postpool_peak_tokens: 8192

# Four persistent random trajectories receive direct supervision at every
# hidden step.  U-statistic matches the transition cloud while the normalized
# MSE of their ensemble mean pins the conditional mean and spatial position.
absolute_hidden_rollout:
  epochs: 12
  # Each molecule follows one randomly sampled two-transition level path.
  steps: 2
  # Validation keeps the hidden state continuous for longer to expose drift.
  validation_steps: 8
  random_samples: 4
  batch_size_per_gpu: 12
  validation_batch_size_per_gpu: 4
  gradient_accumulation_steps: 2
  gradient_checkpointing: false
  intermediate_refine_depth: 6
  compile_rollout: false
  compile_mode: default
  ensemble_mean_mse_weight: 1.0
  # Full-gradient fixed-point loss between every recurrent state and the field
  # encoder reading of its decoded image: MSE(h, E(D(h))).
  hidden_consistency_mse_weight: 0.1
  # Random paths are exchangeable.  One path gives an unbiased consistency
  # estimate while all four remain active for U-statistic and ensemble losses.
  hidden_consistency_samples: 1
  learning_rate: 0.00001
  min_learning_rate: 0.000001
  warmup_steps: 100
  weight_decay: 0.0001
  max_postpool_peak_tokens: 8192

cloud_matching:
  batch_size_per_gpu: 16
  samples: 4
  transition_jumps:
    - {max_level: 8, jump: 1}
    - {max_level: 16, jump: 2}
    - {max_level: 32, jump: 4}
    - {max_level: 64, jump: 8}
  level_sampling: uniform
  unroll_fraction: 0.0
  zero_token_clean_mse_weight: 0.05
  noise_schedule:
    type: cosine_vp
    levels: 64
    cosine_offset: 0.008
    noise_scale: 3.5927782573874403
    zero_mean_noise: true
  validation_preview_levels: [8, 24, 48, 64]
  loss: energy_full_band
  full_band_levels: 3

training:
  epochs: 120
  learning_rate: 0.0001
  min_learning_rate: 0.00001
  validation_fraction: 0.02
  condition_dropout: 0.0
  peak_chunk_size: 256
  log_every: 10

spectrum_encoder:
  heads: 8
  peak_conv_stages: 2
  peak_conv_kernel_size: 5
  peak_tau_min: 0.005
  peak_tau_max: 2.0
  peak_cutoff_multiplier: 8.0
  spectrum_layers: 2
  ffn_ratio: 2.0
  dropout: 0.1
  peak_position_dim: 32
  mz_bin_width: 0.01
  mz_upper_bound: 5000.0
  peak_chunk_batch: 256
