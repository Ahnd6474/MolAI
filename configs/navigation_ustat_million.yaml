# Continue the trained v2 MS model, retaining all weights and Adam moments.
# Counts are cumulative since the MS encoder reset, not a million extra updates.
token_conditioning: true
alignment_steps: 0
max_postpool_peak_tokens: 8192
length_bucket_batches: 16
refine_depth: 3
steps: 1
validation_steps: 1
validation_start_levels: uniform
long_rollout_steps: 20
long_rollout_samples: 4
condition_control_every_epochs: 5
condition_control_batches: 2
random_samples: 4
batch_size_per_gpu: 16
validation_batch_size_per_gpu: 4
gradient_accumulation_steps: 1
gradient_checkpointing: true
compile_rollout: false
compile_blocks: true
compile_loss: true
preserve_bf16_rounding: true
cache_ms_kv: true
packed_ms_kv: true
uncheckpointed_refine_blocks: 2
# 8,443 updates/epoch; the final epoch stops early at exactly max_steps.
epochs: 119
max_steps: 1000000
lr_schedule_start_step: 101316
warmup_start_learning_rate: 0.00001
learning_rate: 0.00003
min_learning_rate: 0.00001
warmup_steps: 1000
weight_decay: 0.0001
loss_name: navigation_ustat
loss_mode: vp_transition_geometry
u_statistic_weight: 1.0
zero_mean_mse_weight: 1.0
random_radius_weight: 1.0
random_direction_weight: 1.0
radius_use_token_rms: true
log_every: 10
